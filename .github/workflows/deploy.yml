name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # GitHub Container Registry for this GitHub repository.
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: privateyst/ragmanage

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_REGISTRY,IMAGE_NAMESPACE,IMAGE_TAG
          script: |
            set -eu
            cd /opt/ragmanage
            export IMAGE_REGISTRY IMAGE_NAMESPACE IMAGE_TAG
            docker compose --env-file .env -f infra/compose/prod.yaml pull
            docker compose --env-file .env -f infra/compose/prod.yaml run --rm api alembic upgrade head
            docker compose --env-file .env -f infra/compose/prod.yaml up -d --remove-orphans
            curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:8081/api/v1/health/ready
