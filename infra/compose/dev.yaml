name: ragmanage-dev
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: ragmanage
      POSTGRES_DB: ragmanage_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run infra/scripts/init-env.ps1 first}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragmanage -d ragmanage_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ../../backend
    environment: &app-environment
      DATABASE_URL: postgresql://ragmanage:${POSTGRES_PASSWORD}@postgres:5432/ragmanage_dev
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/files
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["files:/data/files"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ../../backend
    environment: *app-environment
    command: ["celery", "-A", "app.jobs.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes: ["files:/data/files"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  files:
