name: ragmanage-dev
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_USER: ragmanage
      POSTGRES_DB: ragmanage_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run infra/scripts/init-env.ps1 first}
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragmanage -d ragmanage_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ../../backend
    environment: &app-environment
      DATABASE_URL: postgresql://ragmanage:${POSTGRES_PASSWORD}@postgres:5432/ragmanage_dev
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/files
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.2.59:11434}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen3.8:27b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["files:/data/files"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ../../backend
    environment: *app-environment
    command: ["celery", "-A", "app.jobs.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes: ["files:/data/files"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  files:
