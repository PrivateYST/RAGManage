[project]
name = "ragmanage-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "pgvector>=0.4,<1",
  "celery[redis]>=5.5,<6",
  "markdown-it-py>=3,<5",
  "python-docx>=1.1,<2",
  "pdfplumber>=0.11,<1",
  "httpx>=0.28,<1",
  "argon2-cffi>=23,<26",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
ragmanage-bootstrap-admin = "app.bootstrap:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
